<header class="header">
  <h1>Cadastro de Ticket</h1>

  <div class="user-area">
    <span class="user-name">Olá, Usuário!</span>
    <i class="fa-solid fa-circle-user"></i>
  </div>
</header>
<!-- Conteúdo -->
<main class="content">
  <div class="card">
    <h2>Novo Ticket</h2>

    <form [formGroup]="form" (ngSubmit)="handleSubmit()" class="form">
      <div class="form-group">
        <label for="nome">Nome do Ticket: *</label>
        <input formControlName="nome" type="text" id="nome" name="nome" placeholder="Ex: Proteção Perimetral" />
      </div>

      <div class="form-group">
        <label for="descricao">Descrição do Ticket: *</label>
        <input formControlName="descricao" type="text" id="descricao" placeholder="Ex: Instalação de 4 sensores IR" />
      </div>

      <div class="form-group">
        <label for="endereco">Endereço do Ticket: *</label>
        <input formControlName="endereco" type="text" id="endereco" placeholder="Ex: Endereço da Instalação" />
      </div>

      <div class="form-group">
        <label for="status">Status do Ticket: *</label>
        <select formControlName="status" id="status">
          <option value="">Selecione</option>
          <option value="PENDENTE">Pendente</option>
          <option value="ANDAMENTO">Andamento</option>
          <option value="CONCLUIDO">Concluído</option>
        </select>
      </div>

      <div class="form-group">
        <label for="ativo">Status Ticket: ativado/desativado:</label>
        <select formControlName="ativo" id="ativo">
          <option value="true">Ativado</option>
          <option value="false">Desativado</option>
        </select>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn-primary">Salvar</button>
        <button type="button" class="btn-secondary">Cancelar</button>
      </div>
    </form>
  </div>
</main>
